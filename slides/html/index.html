## Unüberwachtes Lernen: wofür

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Es gibt keine Zielgröße $y$, nur Eingabedaten $X$. Das Verfahren sucht selbst nach Struktur. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Clustering:** ähnliche Datenpunkte zu Gruppen zusammenfassen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Dimensionsreduktion:** viele Merkmale auf wenige verdichten, zum Beispiel für ein Diagramm 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Anomalieerkennung:** Punkte finden, die zu keiner Gruppe passen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Typische Anwendungen: Kunden- oder Versichertensegmente, Gruppen ähnlicher Krankheitsverläufe, Produktempfehlungen, auffällige Abrechnungen

## Unterschied zur Klassifikation

| | Klassifikation | Clustering |
|---|----------------|------------|
| Lernart | überwacht | unüberwacht |
| Zielgröße | bekannt (`y` mit Labels) | gibt es nicht |
| Gruppen | vorher festgelegt: „überlebt", „nicht überlebt" | ergeben sich aus den Daten |
| Bedeutung der Gruppen | durch die Labels gegeben | müssen Sie nachträglich deuten |
| Bewertung | Accuracy, Precision, Recall gegen die Wahrheit | keine Wahrheit: Kompaktheit, Trennung, fachliche Prüfung |
| scikit-learn | `fit(X, y)`, dann `predict(X)` | `fit(X)` oder `fit_predict(X)` |

> [!note]
> Die Clusternummern 0, 1, 2 sind beliebig. Bei einem neuen Lauf mit anderem Startwert kann dieselbe Gruppe eine andere Nummer tragen.
</div></script></section><section data-separator="

## k-Means Schritt für Schritt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**1. k festlegen:** Sie geben die Zahl der Cluster vor 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**2. Zentren wählen:** k Startpunkte als Clusterzentren setzen (zufällig) 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**3. Zuordnen:** jeder Punkt kommt zum nächstgelegenen Zentrum 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**4. Neu berechnen:** jedes Zentrum wandert in den Mittelwert seiner Punkte 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**5. Wiederholen:** Schritte 3 und 4, bis sich die Zentren nicht mehr ändern 

<div class="fragment" data-fragment-index="6">

> [!tip]
> k-Means verkleinert die Summe der quadrierten Abstände aller Punkte zu ihrem Zentrum. scikit-learn nennt diesen Wert `inertia_`.

</div>

## `KMeans` in scikit-learn auf `make_blobs`

```python
import matplotlib.pyplot as plt
from sklearn.cluster import KMeans
from sklearn.datasets import make_blobs

# zweiter Rückgabewert (die wahren Gruppen) wird verworfen
X, _ = make_blobs(n_samples=600, random_state=1,
                  centers=[(-5, 7), (3, 3), (9, 0), (-9, -6)])

kmeans = KMeans(n_clusters=4, n_init=10, random_state=1)
labels = kmeans.fit_predict(X)            # Clusternummer je Punkt
print(kmeans.cluster_centers_.round(1))   # Koordinaten der 4 Zentren
print(round(kmeans.inertia_, 1))          # -> 1161.0

plt.scatter(X[:, 0], X[:, 1], c=labels, s=15)
plt.scatter(kmeans.cluster_centers_[:, 0], kmeans.cluster_centers_[:, 1],
            c="red", s=300, marker="X")
plt.show()
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`make_blobs` erzeugt Punktwolken zum Ausprobieren, hier um vier fest vorgegebene Zentren 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`fit_predict(X)`: kein `y`, kein Train/Test-Split
</div></script></section><section data-separator="

## Silhouetten-Wert

Für jeden Punkt: Wie nah liegt er an seinem eigenen Cluster (a), wie nah am nächsten fremden Cluster (b)?

$s = \\frac{b - a}{\\max(a, b)}$

| Wert | Bedeutung |
|------|-----------|
| nahe 1 | Punkt liegt klar in seinem Cluster |
| nahe 0 | Punkt liegt auf der Grenze zwischen zwei Clustern |
| negativ | Punkt passt besser in ein anderes Cluster |

```python
from sklearn.metrics import silhouette_score

for k in range(2, 7):
    labels = KMeans(n_clusters=k, n_init=10, random_state=1).fit_predict(X)
    print(k, round(silhouette_score(X, labels), 2))
# -> 2 0.57 | 3 0.74 | 4 0.79 | 5 0.68 | 6 0.54
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`silhouette_score` mittelt über alle Punkte. Der höchste Wert spricht für k = 4, passend zum Ellbogen.
</div></script></section><section data-separator="

## Skalieren vor dem Clustern

k-Means rechnet mit Abständen. Ohne Skalierung bestimmt das Merkmal mit den größten Zahlen fast allein das Ergebnis.

```python
import pandas as pd
df = pd.read_csv("data/versicherte.csv")
merkmale = ["alter", "bmi", "arztbesuche_jahr", "leistungsausgaben_eur"]
df = df.drop_duplicates().dropna(subset=merkmale)   # kein NaN erlaubt
print(df[merkmale].describe().loc[ ["min", "max", "std"] ].round(1))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Zwei Versicherte unterscheiden sich um 10 BMI-Punkte und um 1000 Euro Leistungsausgaben 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Quadrierter Abstand ohne Skalierung: 10² + 1000² = 100 + 1000000. Der BMI trägt 0.01 Prozent bei. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Nach `StandardScaler` hat jedes Merkmal Mittelwert 0 und Standardabweichung 1 und zählt gleich viel 

<div class="fragment" data-fragment-index="4">

```python
from sklearn.preprocessing import StandardScaler
X_scaled = StandardScaler().fit_transform(df[merkmale])
```

</div>

<div class="fragment" data-fragment-index="5">

> Ohne Skalierung segmentiert k-Means die Versicherten praktisch nur nach `leistungsausgaben_eur`.

## Segmentierung der Versichertendaten: Cluster bilden

```python
from sklearn.cluster import KMeans

# 1. k prüfen: Ellbogen-Kurve auf den skalierten Daten
for k in range(2, 9):
    km = KMeans(n_clusters=k, n_init=10, random_state=1).fit(X_scaled)
    print(k, round(km.inertia_))

# 2. Mit dem gewählten k clustern und die Nummer in die Tabelle schreiben
kmeans = KMeans(n_clusters=4, n_init=10, random_state=1)
df["segment"] = kmeans.fit_predict(X_scaled)

# 3. Wie groß sind die Segmente?
print(df["segment"].value_counts().sort_index())
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Geclustert wird auf `X_scaled`, beschrieben wird später auf den Originalwerten in `df` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Nur Merkmale verwenden, die für die Fragestellung zählen. Eine Versichertennummer oder Postleitzahl hat im Abstand nichts verloren.

## Grenzen von k-Means

| Grenze | Was passiert | Was Sie tun können |
|--------|--------------|--------------------|
| **Runde Cluster** | k-Means trennt nach Abstand zum Zentrum und findet nur kompakte, etwa kugelförmige Gruppen. Längliche oder ringförmige Gruppen werden zerschnitten. | anderes Verfahren (DBSCAN) |
| **Ausreißer** | Ein Extremwert zieht den Mittelwert und damit das Zentrum zu sich oder bekommt ein eigenes Cluster | Ausreißer vorher prüfen, schiefe Größen logarithmieren |
| **k vorgeben** | Das Verfahren liefert immer genau k Gruppen, auch wenn es keine gibt | Ellbogen, Silhouette, fachliche Prüfung |
| **Startwerte** | Ergebnis hängt vom Start ab | `n_init=10`, `random_state` setzen |
| **Nur Zahlen** | Mittelwerte und Abstände brauchen numerische, skalierte Merkmale | skalieren, Kategorien zur Beschreibung nutzen |
</div></script></section><section data-separator="

## DBSCAN als Alternative

DBSCAN bildet Cluster dort, wo Punkte dicht beieinander liegen. Punkte in dünn besetzten Gegenden gelten als Rauschen.

```python
from sklearn.cluster import DBSCAN

X_blobs = StandardScaler().fit_transform(X)     # Blobs von vorhin, skaliert
labels = DBSCAN(eps=0.2, min_samples=5).fit_predict(X_blobs)
print(pd.Series(labels).value_counts().sort_index())
# -> -1: 2 | 0: 150 | 1: 149 | 2: 150 | 3: 149     (-1 = Rauschen)
```

| | k-Means | DBSCAN |
|---|---------|--------|
| Zahl der Cluster | geben Sie vor | ergibt sich |
| Form der Cluster | rund | beliebig |
| Ausreißer | werden einem Cluster zugeschlagen | bekommen das Label `-1` |
| Stellschrauben | `n_clusters` | `eps` (Radius der Nachbarschaft), `min_samples` |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Empfindlich gegenüber `eps`: mit `eps=0.3` verschmelzen hier zwei Wolken zu einem Cluster
</div></script></section><section data-separator="

## PCA zur zweidimensionalen Darstellung

Vier Merkmale lassen sich nicht in ein Streudiagramm zeichnen. PCA (Hauptkomponentenanalyse) bildet neue Achsen, die möglichst viel Streuung der Daten behalten.

```python
from sklearn.decomposition import PCA

pca = PCA(n_components=2, random_state=1)
X_pca = pca.fit_transform(X_scaled)               # 4 Spalten -> 2 Spalten

anteil = pca.explained_variance_ratio_
print(anteil.round(2), "Summe:", anteil.sum().round(2))

plt.scatter(X_pca[:, 0], X_pca[:, 1], c=df["segment"], s=8, alpha=0.5)
plt.xlabel(f"Hauptkomponente 1 ({anteil[0]:.0%})")
plt.ylabel(f"Hauptkomponente 2 ({anteil[1]:.0%})")
plt.show()
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`explained_variance_ratio_`: Anteil der Gesamtstreuung je Hauptkomponente. Die Summe sagt, wie viel Information das 2D-Bild behält. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Hauptkomponenten sind Mischungen der Originalmerkmale und unkorreliert. Vor der PCA die Merkmale standardisieren.
</div></script></section><section data-separator="

## t-SNE als Ausblick

t-SNE (t-distributed Stochastic Neighbor Embedding) ordnet Punkte in 2D so an, dass Nachbarn aus dem hochdimensionalen Raum Nachbarn bleiben.

```python
from sklearn.manifold import TSNE

tsne = TSNE(n_components=2, random_state=1)
X_tsne = tsne.fit_transform(X_scaled)

plt.scatter(X_tsne[:, 0], X_tsne[:, 1], c=df["segment"], s=8, alpha=0.5)

```

| | PCA | t-SNE |
|---|-----|-------|
| Art | linear | nichtlinear |
| Achsen | deutbar (Mischung der Merkmale) | ohne Bedeutung |
| Abstände zwischen Gruppen | aussagekräftig | nicht aussagekräftig |
| Neue Daten | `transform` möglich | kein `transform` |
| Rechenzeit | kurz | deutlich länger |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->t-SNE ist ein Werkzeug zum Ansehen von Daten, nicht zur Vorverarbeitung für Modelle

## Vom biologischen zum künstlichen Neuron

Künstliche neuronale Netze sind vom Gehirn inspiriert: Milliarden von Neuronen sind über Synapsen verbunden und tauschen elektrische und chemische Signale aus.

| Biologisches Netz               | Künstliches Netz                                  |
|---------------------------------|---------------------------------------------------|
| Neuron                          | Knoten im Netz                                    |
| Synapse                         | Verbindung mit einem **Gewicht**                  |
| elektrischer Impuls             | **Aktivierung**, berechnet aus den Eingabewerten  |
| Lernen durch Erfahrung          | Anpassen der Gewichte beim **Training**           |
</div></script></section><section data-separator="

## Das künstliche Neuron: Gewichte, Bias, Aktivierung

<img src="../figs/d_t09_neuron.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Eingaben** `x`: die Merkmale, zum Beispiel Pixelwerte oder Spalten einer Tabelle 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gewichte** `w`: wie stark eine Eingabe weitergegeben wird 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Bias** `b`: verschiebt die Schwelle, ab der das Neuron anspricht 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Summation**: `z` ist die gewichtete Summe plus Bias (Präaktivierung) 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Aktivierung**: eine Funktion `f` macht aus `z` den Ausgabewert `a` 

<div class="fragment" data-fragment-index="6">

> [!tip]
> Gewichte und Bias sind die Parameter, die das Training anpasst. Die Eingaben kommen aus den Daten.

</div>
</div></script></section><section data-separator="

## Schichten: das Feed-Forward-Netz

<img src="../figs/d_t09_feed_forward.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Eine **Schicht** nimmt Eingaben entgegen, verarbeitet sie und gibt das Ergebnis weiter 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Feed Forward**: von der Eingabe über versteckte Schichten zur Ausgabe, ohne Rückkopplung 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Vollständig verbunden**: jedes Neuron einer Schicht hängt an jedem Neuron der nächsten 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Eine ganze Schicht ist eine Matrixrechnung: `Z = W X + b` 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->In den versteckten Schichten entstehen **Merkmale**, die das Netz selbst aus den Daten bildet
</div></script></section><section data-separator="

## Warum Nichtlinearität und Tiefe helfen: XOR

<img src="../figs/xor_trennbarkeit.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->OR lässt sich mit einer einzigen Geraden trennen, XOR nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein Netz aus nur linearen Schichten bleibt insgesamt eine lineare Funktion, egal wie viele Schichten es hat 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Erst die Aktivierungsfunktion zwischen den Schichten bringt Nichtlinearität ins Netz 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Mehr versteckte Schichten bedeuten mehr Tiefe: einfache Muster werden Schicht für Schicht zu komplexen kombiniert
</div></script></section><section data-separator="

## Aktivierungsfunktionen

| Funktion    | Formel                            | Wertebereich        | Typischer Einsatz                                             |
|-------------|-----------------------------------|---------------------|---------------------------------------------------------------|
| **ReLU**    | `max(0, z)`                       | 0 bis unendlich     | versteckte Schichten, Standardwahl in modernen Netzen         |
| **Sigmoid** | `1 / (1 + exp(-z))`               | 0 bis 1             | Ausgabe bei zwei Klassen, liest sich wie eine Wahrscheinlichkeit |
| **Tanh**    | `tanh(z)`                         | -1 bis 1            | ähnlich wie Sigmoid, gut für Werte um 0                       |
| **Softmax** | `exp(z_i) / Summe aller exp(z_j)` | 0 bis 1, Summe 1    | Ausgabe bei mehreren Klassen                                  |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->ReLU setzt negative Werte auf 0: schnell zu rechnen und gut zu trainieren 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sigmoid in versteckten Schichten gilt als veraltet, weil die Funktion an den Rändern sättigt 

<div class="fragment" data-fragment-index="3">

> [!warning]
> `nn.CrossEntropyLoss` in PyTorch rechnet Softmax schon mit ein. Die letzte Schicht gibt deshalb rohe Werte (Logits) aus, ohne eigene Softmax-Schicht.

</div>

## Verlustfunktionen

Die Verlustfunktion misst mit einer einzigen Zahl, wie schlecht die Vorhersagen sind. Das Training macht diese Zahl kleiner.

| Verlust                  | In einem Satz                                                                                   | PyTorch                 |
|--------------------------|--------------------------------------------------------------------------------------------------|-------------------------|
| **MSE**                  | Mittelwert der quadrierten Abstände zwischen Vorhersage und wahrem Wert, für Regression          | `nn.MSELoss()`          |
| **Cross-Entropy**        | Misst den Abstand zwischen vorhergesagten Klassenwahrscheinlichkeiten und wahren Labels, für mehrere Klassen | `nn.CrossEntropyLoss()` |
| **Binary Cross-Entropy** | Dasselbe für genau zwei Klassen, passt zu einer Sigmoid-Ausgabe                                   | `nn.BCELoss()`          |

> [!tip]
> Cross-Entropy bestraft große Abweichungen stark: eine falsche Vorhersage mit hoher Sicherheit kostet viel mehr als eine unsichere.
</div></script></section><section data-separator="

## Training als Schleife

<img src="../figs/d_t09_training_schleife.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Vorwärtslauf**: Eingaben laufen durch das Netz, am Ende steht eine Vorhersage 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Verlust**: Vergleich von Vorhersage und wahrem Wert 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Rückwärtslauf** (Backpropagation): für jedes Gewicht ausrechnen, in welche Richtung es den Verlust verändert 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Schritt des Optimierers**: jedes Gewicht ein kleines Stück in die Richtung verschieben, die den Verlust senkt
</div></script></section><section data-separator="

## Epoche, Batch, Lernrate und Optimierer

| Begriff      | Bedeutung                                                                                  | Im Beispiel                   |
|--------------|---------------------------------------------------------------------------------------------|-------------------------------|
| **Batch**    | kleine Gruppe von Beispielen, auf der ein Gradient berechnet wird (üblich: 32 oder 64)     | `batch_size=64`               |
| **Epoche**   | ein vollständiger Durchlauf durch alle Trainingsdaten                                      | 60000 Bilder = 938 Batches    |
| **Lernrate** | Schrittweite, mit der die Gewichte angepasst werden                                        | `lr=1e-3`                     |
| **SGD**      | Gradientenabstieg auf Batches mit fester Lernrate                                          | `optim.SGD(..., lr=1e-2)`     |
| **Adam**     | Weiterentwicklung von SGD, passt die Schrittweite je Gewicht selbst an                     | `optim.Adam(..., lr=1e-3)`    |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Zu große Lernrate: der Verlust springt oder steigt. Zu kleine Lernrate: das Training kommt kaum voran 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Übliche Startwerte: `1e-2` für SGD, `1e-3` für Adam
</div></script></section><section data-separator="

## Overfitting bei Netzen: Dropout und Early Stopping

Ein Netz mit hunderttausend Gewichten kann die Trainingsdaten auswendig lernen. Das Zeichen dafür kennen Sie schon: der Verlust auf den Trainingsdaten sinkt weiter, der auf den Validierungsdaten steigt wieder.

<div class="two-col">
<div style="flex: 50">

**Dropout**

```python
self.drop = nn.Dropout(0.3)
```

- schaltet beim Training zufällig 30 % der Neuronen einer Schicht ab
- das Netz kann sich nicht auf einzelne Neuronen verlassen
- bei der Auswertung ist Dropout aus

</div>
<div style="flex: 50">

**Early Stopping**

- nach jeder Epoche den Verlust auf den Validierungsdaten messen
- die bisher besten Gewichte merken
- abbrechen, wenn sich der Wert mehrere Epochen lang nicht verbessert

</div>
</div>

> [!important]
> `model.train()` vor dem Training, `model.eval()` vor der Auswertung. Nur so ist Dropout zur richtigen Zeit an und aus.

## PyTorch: Tensoren anlegen und rechnen

x = torch.tensor([1, 2, 3])          # Tensor = n-dimensionales Array

a = torch.tensor([ [1., 2], [3, 4] ])

print(a @ b)      # Matrizenmultiplikation -> [ [19., 22.], [43., 50.] ]
print(a * b)      # elementweise           -> [ [ 5., 12.], [21., 32.] ]
print(a.sum(), b.mean())             # -> tensor(10.) tensor(6.5000)
```

Ein Tensor verhält sich wie ein NumPy-Array. Zusätzlich kann er Gradienten mitführen und auf einer Grafikkarte liegen.

## Autograd an einer kleinen Funktion

```python
x = torch.tensor(2.0, requires_grad=True)   # Gradienten mitführen

y = x**2 + 3*x + 5                          # f(x)
y.backward()                                # Ableitung berechnen

print(x.grad)                               # -> tensor(7.)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Von Hand: `f'(x) = 2*x + 3`, also `f'(2.0) = 7.0` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`requires_grad=True`: PyTorch merkt sich jede Rechnung, an der `x` beteiligt ist 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`backward()` läuft diese Rechnungen rückwärts ab und legt die Ableitung in `x.grad` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Genau das passiert im Rückwärtslauf für jedes Gewicht des Netzes
</div></script></section><section data-separator="

## Ein einzelner Trainingsschritt

```python
import torch.nn as nn
import torch.optim as optim

torch.manual_seed(42)
netz = nn.Linear(10, 1)                     # 10 Eingänge, 1 Ausgang: Wx + b
loss_fn = nn.MSELoss()
optimizer = optim.SGD(netz.parameters(), lr=1e-1)

x = torch.rand(10)                          # Eingabevektor
y = torch.ones(1)                           # Ziel: das Netz soll 1 ausgeben

loss = loss_fn(netz(x), y)                  # Vorwärtslauf und Verlust
print(f"Verlust vorher:  {loss.item():.4f}")
loss.backward()                             # Rückwärtslauf
optimizer.step()                            # Gewichte anpassen
print(f"Verlust nachher: {loss_fn(netz(x), y).item():.4f}")
```

Nach einem einzigen Schritt ist der Verlust kleiner als vorher. Training heißt, diesen Schritt viele tausend Mal zu wiederholen.
</div></script></section><section data-separator="

## Ein `nn.Module` mit zwei Linearschichten

```python
class Netz(nn.Module):
    def __init__(self):
        super().__init__()
        self.flatten = nn.Flatten()              # 1x28x28 -> 784
        self.layer1 = nn.Linear(28 * 28, 128)    # 784 -> 128
        self.layer2 = nn.Linear(128, 10)         # 128 -> 10 Klassen

    def forward(self, x):
        x = self.flatten(x)
        x = torch.relu(self.layer1(x))           # x = ReLU(Wx + b)
        return self.layer2(x)                    # Logits, ohne Softmax

torch.manual_seed(42)
model = Netz()
print(sum(p.numel() for p in model.parameters()))    # -> 101770
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`__init__` legt die Schichten an, `forward` beschreibt den Vorwärtslauf 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie rufen `forward` nicht direkt auf, sondern `model(bilder)` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->101770 Parameter: `784*128 + 128` in der ersten, `128*10 + 10` in der zweiten Schicht
</div></script></section><section data-separator="

## Die vollständige Trainingsschleife

```python
loss_fn = nn.CrossEntropyLoss()              # mehrere Klassen
optimizer = optim.Adam(model.parameters(), lr=1e-3)
n_epochs = 3

for epoch in range(n_epochs):
    model.train()                            # Trainingsmodus
    running_loss = 0.0
    for bilder, labels in train_loader:
        optimizer.zero_grad()                # alte Gradienten löschen
        outputs = model(bilder)              # Vorwärtslauf
        loss = loss_fn(outputs, labels)      # Verlust
        loss.backward()                      # Rückwärtslauf
        optimizer.step()                     # Gewichte anpassen
        running_loss += loss.item()
    print(f"Epoche {epoch + 1}/{n_epochs}, "
          f"Verlust: {running_loss / len(train_loader):.4f}")
```

> [!warning]
> Ohne `optimizer.zero_grad()` addiert PyTorch die Gradienten aller Batches auf, und das Training läuft aus dem Ruder.

```python

with torch.no_grad():                        # keine Gradienten nötig

        total += labels.size(0)

print(f"Genauigkeit: {correct / total * 100:.2f} %")

## CNN: die Faltung

Ein kleiner Filter (zum Beispiel 3 x 3) wandert über das Bild. An jeder Stelle multipliziert er die Pixelwerte mit den Filterwerten und summiert die Produkte. Das Ergebnis ist eine **Feature Map**.

$$\\underbrace{\\begin{pmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{pmatrix}}\_{\\text{Bildausschnitt}} \\odot \\underbrace{\\begin{pmatrix} 0 & 1 & 0 \\\\ 1 & -1 & 1 \\\\ 0 & 1 & 0 \\end{pmatrix}}\_{\\text{Filter}} \\;\\Rightarrow\\; 2 + 4 - 5 + 6 + 8 = 15$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Filter erkennt ein lokales Muster, zum Beispiel eine Kante 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Derselbe Filter gilt für das ganze Bild: das Muster wird an jeder Position gefunden 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Filterwerte sind die Gewichte. Das Netz lernt sie im Training selbst

## CNN: Pooling und der Nutzen für Bilder

$$\\underbrace{\\left(\\begin{array}{cc|cc} 1 & 3 & 2 & 1 \\\\ 4 & 6 & 5 & 7 \\\\ \\hline 8 & 6 & 9 & 4 \\\\ 3 & 2 & 4 & 8 \\end{array}\\right)}\_{\\text{Feature Map } 4 \\times 4} \\;\\xrightarrow{\\;\\text{Max-Pooling } 2 \\times 2\\;}\\; \\begin{pmatrix} 6 & 7 \\\\ 8 & 9 \\end{pmatrix}$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Max-Pooling** übernimmt je Bereich den größten Wert: die Feature Map schrumpft, die stärksten Signale bleiben 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Das spart Rechenaufwand und macht Merkmale robust gegen kleine Verschiebungen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Nachbarschaft bleibt erhalten**: eine Linearschicht sieht 784 einzelne Zahlen, eine Faltung sieht Pixel mit ihren Nachbarn 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Wenige Parameter**: `Conv2d(1, 32, 3)` hat 320 Gewichte, die erste Linearschicht des Netzes von vorhin 100480 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Typischer Aufbau: mehrmals Faltung, ReLU, Pooling, am Ende Linearschichten für die Klassen

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Neuron rechnet `z = w*x + b` und wendet darauf eine Aktivierungsfunktion an. Ohne Aktivierung bliebe jedes Netz linear 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Training ist eine Schleife aus vier Schritten: `model(x)`, `loss_fn(...)`, `loss.backward()`, `optimizer.step()`, davor `optimizer.zero_grad()` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Epochenzahl, Batchgröße und Lernrate steuern das Training. Dropout und Early Stopping bremsen Overfitting 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->In PyTorch beschreiben Sie das Netz als `nn.Module`, laden Daten mit dem `DataLoader` und speichern die Gewichte mit `state_dict` 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Deep Learning spielt seine Stärke bei Bildern, Text und Audio aus. Für Tabellen bleiben die klassischen Modelle der Startpunkt

## Die drei Rollen in scikit-learn

| Rolle | Methoden | Was passiert | Beispiele |
|---|---|---|---|
| **Estimator** | `fit(X, y)` | lernt etwas aus Daten und merkt es sich | jede Klasse, die aus Daten lernt |
| **Transformer** | `fit`, `transform`, `fit_transform` | lernt Kennwerte und rechnet Daten damit um | `StandardScaler`, `OneHotEncoder`, `SimpleImputer`, `PCA` |
| **Predictor** | `fit`, `predict`, `score` | lernt ein Modell und sagt damit vorher | `LogisticRegression`, `RandomForestClassifier`, `KMeans` |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Gelernte Größen enden auf einen Unterstrich: `scaler.mean_`, `modell.coef_`, `kmeans.cluster_centers_` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Einstellungen, die Sie selbst setzen, stehen im Konstruktor: `max_depth=5`, `strategy="median"` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Weil diese Klassen dieselben Methoden haben, lassen sie sich hintereinanderstecken

## Bekannt aus Teil 5: teilen, dann skalieren

```python
from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler
from sklearn.linear_model import LogisticRegression

X, y = load_breast_cancer(return_X_y=True)
X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.3, random_state=1, stratify=y)

scaler = StandardScaler()
X_train_s = scaler.fit_transform(X_train)  # fit NUR auf Training
X_test_s = scaler.transform(X_test)        # Testdaten nur umrechnen

modell = LogisticRegression(max_iter=1000)
modell.fit(X_train_s, y_train)
print(modell.score(X_test_s, y_test))
```

> [!tip]
> Merkregel: `fit` und `fit_transform` sehen nur Trainingsdaten. Testdaten bekommen ausschließlich `transform` und `predict`.

## Was beim Leck durchsickert

```python
import pandas as pd
df = pd.read_csv("data/titanic.csv")
X_num = df[ ["Age", "Fare"] ].fillna(df[ ["Age", "Fare"] ].median())

X_tr, X_te = train_test_split(X_num, test_size=0.2, random_state=1)
print(StandardScaler().fit(X_num).mean_)  # -> [29.36 32.20]  alle Zeilen
print(StandardScaler().fit(X_tr).mean_)   # -> [29.73 31.95]  nur Training
```

| Schritt | Was aus den Testdaten ins Training gelangt |
|---|---|
| Skalieren vor dem Split | Mittelwert und Standardabweichung |
| Fehlende Werte vor dem Split füllen | Median oder häufigster Wert |
| Encoding vor dem Split | Kategorien, die nur in den Testdaten vorkommen |
| Ausreißer vor dem Split entfernen | Quartile und Grenzen |

> [!warning]
> Auch `fillna(df.median())` in Zeile 3 ist ein Leck: Der Median stammt aus allen Zeilen.

## Wo die Handarbeit an Grenzen stößt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jeder weitere Schritt (fehlende Werte füllen, Encoding, Skalierung) braucht wieder ein eigenes `fit` auf Training und `transform` auf Test 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bei Cross-Validation müssten Sie das in jedem der fünf Durchgänge neu tun 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Für neue Daten im Einsatz müssen alle Schritte in derselben Reihenfolge noch einmal laufen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Beim Speichern brauchen Sie Scaler, Encoder und Modell als getrennte Dateien 

<div class="fragment" data-fragment-index="5">

> [!important]
> Eine `Pipeline` fasst alle Schritte in einem Objekt mit einem `fit` und einem `predict` zusammen.

</div>

## `Pipeline` mit zwei Schritten

```python
from sklearn.pipeline import Pipeline

pipe = Pipeline([
    ("scaler", StandardScaler()),
    ("modell", LogisticRegression(max_iter=1000)),
])

pipe.fit(X_train, y_train)          # rohe Trainingsdaten hinein
print(pipe.score(X_test, y_test))   # rohe Testdaten hinein
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jeder Schritt ist ein Paar aus frei gewähltem Namen und Objekt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Alle Schritte außer dem letzten müssen Transformer sein 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Der letzte Schritt ist meist ein Predictor
</div></script></section><section data-separator="

## Was `fit` und `predict` in der Pipeline auslösen

```text
pipe.fit(X_train, y_train)
    scaler.fit_transform(X_train)   ->  X_train_s
    modell.fit(X_train_s, y_train)

pipe.predict(X_test)
    scaler.transform(X_test)        ->  X_test_s      (kein fit!)
    modell.predict(X_test_s)        ->  y_pred
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Bei `fit` ruft die Pipeline für jeden Transformer `fit_transform` auf und reicht das Ergebnis weiter 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bei `predict` und `score` ruft sie nur `transform` auf 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Merkregel von eben ist damit fest eingebaut
</div></script></section><section data-separator="

pipe[:-1].transform(X_test)            # Daten nach der Aufbereitung

## Zwei kleine Pipelines für zwei Spaltengruppen

```python
from sklearn.pipeline import Pipeline
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import OneHotEncoder, StandardScaler

numeric_pipe = Pipeline([
    ("imputer", SimpleImputer(strategy="median")),
    ("scaler", StandardScaler()),
])

categorical_pipe = Pipeline([
    ("imputer", SimpleImputer(strategy="most_frequent")),
    ("encoder", OneHotEncoder(handle_unknown="ignore")),
])
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Zahlen: fehlende Werte mit dem Median füllen, danach standardisieren 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Kategorien: fehlende Werte mit dem häufigsten Wert füllen, danach One-Hot-Encoding
</div></script></section><section data-separator="

    ("num", numeric_pipe, num_cols),

])

Xt = preprocess.fit_transform(X_train)
print(Xt.shape)                          # -> (712, 12)
print(preprocess.get_feature_names_out())
```

## `handle_unknown="ignore"` und unbekannte Kategorien

```python
hafen = X_train[ ["Embarked"] ].dropna()
neu = pd.DataFrame({"Embarked": ["X"]})   # Hafen fehlt im Training

streng = OneHotEncoder()                  # Standard: "error"
streng.fit(hafen)
streng.transform(neu)                     # -> ValueError

tolerant = OneHotEncoder(handle_unknown="ignore")
tolerant.fit(hafen)
print(tolerant.transform(neu).toarray())  # -> [ [0. 0. 0.] ]
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Im Einsatz tauchen Kategorien auf, die das Training nie gesehen hat 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Mit `"ignore"` bekommt eine solche Zeile in allen Spalten dieser Kategorie eine 0 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das Modell rechnet weiter, statt mit einer Fehlermeldung abzubrechen

clf.fit(X_train, y_train)

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`X_train` geht als DataFrame mit fehlenden Werten und Text hinein 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`prep` füllt, skaliert und kodiert, `modell` lernt auf dem Ergebnis 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein einziges Objekt `clf` enthält jetzt die gesamte Verarbeitung

    ("prep", preprocess),
    ("modell", RandomForestClassifier(n_estimators=200, random_state=1)),
])

rf.fit(X_train, y_train)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Aufbereitung bleibt unverändert, nur der letzte Schritt wechselt

## Cross-Validation der ganzen Pipeline

```python
from sklearn.model_selection import cross_val_score

for name, pipe in [("LogReg", clf), ("RandomForest", rf)]:
    scores = cross_val_score(pipe, X_train, y_train,
                             cv=5, scoring="accuracy")
    print(f"{name}: {scores.mean():.3f} +/- {scores.std():.3f}")

# -> LogReg: 0.795 +/- 0.018
# -> RandomForest: 0.780 +/- 0.031
```

> [!important]
> In jedem der fünf Durchgänge lernt die Pipeline Median, Skalierung und Kategorien neu, nur aus dem jeweiligen Trainingsteil.

## `GridSearchCV` über Pipeline-Parameter

```python
from sklearn.model_selection import GridSearchCV

param_grid = {
    "modell__max_depth": [3, 5, 8, None],
    "modell__min_samples_leaf": [1, 3, 5],
}

search = GridSearchCV(rf, param_grid, cv=5, scoring="accuracy", n_jobs=-1)
search.fit(X_train, y_train)

print(search.best_params_)
# -> {'modell__max_depth': 5, 'modell__min_samples_leaf': 1}
print(round(search.best_score_, 3))   # -> 0.81
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`modell__max_depth` heißt: Parameter `max_depth` im Schritt `modell` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->4 mal 3 Kombinationen mal 5 Durchgänge ergeben 60 Trainingsläufe
</div></script></section><section data-separator="

## Häufige Fehler im Workflow

| Fehler | Folge |
|---|---|
| Scaler oder Encoder auf allen Daten anpassen, dann teilen | Datenleck, zu gute Zahlen |
| Zeilen mit fehlender Zielgröße löschen, ohne nach dem Grund zu fragen | verzerrte Stichprobe |
| Automatisch erkannten Datentypen vertrauen (Datum, Ja/Nein) | falsche Aufbereitung |
| Accuracy bei ungleichen Klassen | das Modell übersieht die seltene Klasse |
| Kategorien mit sehr vielen Ausprägungen ungeprüft one-hot-kodieren | tausende fast leere Spalten |
| Aufbereitung nicht mit dem Modell versionieren | Modell lässt sich nicht nachvollziehen |
| Zufälliger Split bei zeitlich geordneten Daten | das Modell lernt aus der Zukunft |
</div></script></section><section data-separator="

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Transformer und Modelle teilen sich `fit`, `transform` und `predict`, deshalb lassen sie sich zu einer `Pipeline` verketten 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein Datenleck entsteht, sobald `fit` Testdaten sieht. Die Pipeline verhindert das, auch in jedem Durchgang der Cross-Validation 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`ColumnTransformer` gibt Zahlen- und Kategoriespalten getrennte Aufbereitung, `handle_unknown="ignore"` fängt neue Kategorien ab 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`GridSearchCV` stellt Pipeline-Parameter über `schritt__parameter` ein, das Testset kommt genau einmal am Ende 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Eine `.joblib`-Datei mit notierten Versionen und `random_state` macht das Ergebnis wiederholbar

## Spalten wählen, ohne die Antwort mitzugeben

```python
from sklearn.model_selection import train_test_split
from sklearn.compose import ColumnTransformer
from sklearn.preprocessing import OneHotEncoder, StandardScaler

num_cols = ["Air temperature [K]", "Process temperature [K]",
            "Rotational speed [rpm]", "Torque [Nm]", "Tool wear [min]"]
cat_cols = ["Type"]
X = df[num_cols + cat_cols]        # ohne UDI, Product ID, TWF ... RNF
y = df["Machine failure"]

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.2, random_state=1, stratify=y)

prep = ColumnTransformer([
    ("num", StandardScaler(), num_cols),
    ("cat", OneHotEncoder(handle_unknown="ignore"), cat_cols),
])
```

> [!warning]
> `TWF` bis `RNF` stehen erst fest, wenn der Ausfall schon passiert ist. Mit diesen Spalten erreicht ein Modell 99,9 % Accuracy und ist im Einsatz wertlos.
</div></script></section><section data-separator="

## Baseline: hohe Accuracy, kaum Recall

```python
from sklearn.pipeline import Pipeline
from sklearn.model_selection import cross_validate
from sklearn.dummy import DummyClassifier
from sklearn.linear_model import LogisticRegression

def bewerte(modell):
    pipe = Pipeline([("prep", prep), ("modell", modell)])
    cv = cross_validate(pipe, X_train, y_train, cv=5,
                        scoring=["accuracy", "recall", "precision"])
    return {k[5:]: round(float(v.mean()), 2)
            for k, v in cv.items() if k.startswith("test_")}

print(bewerte(DummyClassifier(strategy="most_frequent")))
# -> {'accuracy': 0.97, 'recall': 0.0, 'precision': 0.0}
print(bewerte(LogisticRegression(max_iter=1000)))
# -> {'accuracy': 0.97, 'recall': 0.18, 'precision': 0.74}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Das Modell, das nie einen Ausfall meldet, erreicht 97 % Accuracy 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die logistische Regression findet nur 18 von 100 Ausfällen
</div></script></section><section data-separator="

## `class_weight="balanced"`: seltene Klasse stärker gewichten

```python
from sklearn.ensemble import RandomForestClassifier

print(bewerte(LogisticRegression(max_iter=1000, class_weight="balanced")))
print(bewerte(RandomForestClassifier(n_estimators=200, random_state=1)))
print(bewerte(RandomForestClassifier(n_estimators=200, min_samples_leaf=5,
                                     class_weight="balanced",
                                     random_state=1)))
```

## Schwellenwert festlegen und auf dem Testset prüfen

```python
from sklearn.model_selection import cross_val_predict
from sklearn.metrics import classification_report, confusion_matrix

rf = Pipeline([("prep", prep), ("modell", RandomForestClassifier(
    n_estimators=200, min_samples_leaf=5, class_weight="balanced",
    random_state=1))])

proba = cross_val_predict(rf, X_train, y_train, cv=5,
                          method="predict_proba")[:, 1]
# Schwelle 0.5: Recall 0.85, Precision 0.43
# Schwelle 0.3: Recall 0.92, Precision 0.27
# Schwelle 0.2: Recall 0.93, Precision 0.22

rf.fit(X_train, y_train)
y_pred = (rf.predict_proba(X_test)[:, 1] >= 0.3).astype(int)
print(confusion_matrix(y_test, y_pred))   # -> [ [1792 140] [3 65] ]
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Testset mit Schwelle 0,3: 65 von 68 Ausfällen gefunden, dafür 140 Fehlalarme auf 2 000 Zeilen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Welche Schwelle richtig ist, entscheidet die Fachseite: Was kostet ein übersehener Ausfall, was eine unnötige Wartung?

## Regression: Hauswerte mit Pipeline

```python
from sklearn.linear_model import LinearRegression

df = pd.read_csv("data/california_housing.csv")

## RMSE, MAE und R² auf dem Testset

```python
import numpy as np
from sklearn.metrics import (mean_squared_error, mean_absolute_error,
                             r2_score)
from sklearn.model_selection import cross_val_score

rmse_cv = -cross_val_score(reg, X_train, y_train, cv=5,
                           scoring="neg_root_mean_squared_error")
print(rmse_cv.mean().round(3))                # -> 0.727

y_pred = reg.predict(X_test)
print(round(np.sqrt(mean_squared_error(y_test, y_pred)), 3))  # -> 0.727
print(round(mean_absolute_error(y_test, y_pred), 3))          # -> 0.533
print(round(r2_score(y_test, y_pred), 3))                     # -> 0.597
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->RMSE 0,73 heißt: Die Vorhersage liegt typischerweise um rund 73.000 USD daneben 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->scikit-learn gibt Fehlermaße negativ zurück, damit „größer ist besser" überall gilt

## Clustering: Versicherte segmentieren

```python
from sklearn.impute import SimpleImputer
from sklearn.cluster import KMeans

df = pd.read_csv("data/versicherte.csv").drop_duplicates()
merkmale = ["alter", "bmi", "arztbesuche_jahr", "leistungsausgaben_eur"]

segmentierung = Pipeline([
    ("imputer", SimpleImputer(strategy="median")),
    ("scaler", StandardScaler()),
    ("kmeans", KMeans(n_clusters=4, n_init=10, random_state=1)),
])

df = df.assign(segment=segmentierung.fit_predict(df[merkmale]))
print(df["segment"].value_counts().sort_index())
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`bmi` hat Lücken, `KMeans` bricht bei fehlenden Werten ab: Der Imputer gehört in die Pipeline 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ohne Skalierung bestimmt allein `leistungsausgaben_eur` die Segmente, weil die Spalte die größten Zahlen hat

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Roh: Änderung der Vorhersage je Einheit des Merkmals. `AveBedrms` wirkt am größten, weil die Spalte nur in einem engen Bereich um 1 schwankt

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das Vorzeichen gibt die Richtung an, jeweils bei festgehaltenen übrigen Merkmalen

## `feature_importances_` des Random Forest

```python
rf = Pipeline([
    ("prep", preprocess),
    ("modell", RandomForestClassifier(n_estimators=200, random_state=1)),
])
rf.fit(X_train, y_train)

wichtigkeit = pd.Series(
    rf.named_steps["modell"].feature_importances_,
    index=rf.named_steps["prep"].get_feature_names_out(),
).sort_values(ascending=False)
print(wichtigkeit.head(5).round(3))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Misst, wie stark ein Merkmal über alle Bäume hinweg die Unreinheit der Knoten verringert 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Werte summieren sich zu 1 und fallen beim Training ohne Mehraufwand an 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie sagen nichts über die Richtung: ob ein hoher Wert die Klasse wahrscheinlicher oder unwahrscheinlicher macht, bleibt offen

## Schwächen von `feature_importances_`

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie werden aus den Trainingsdaten berechnet: Ein Merkmal, mit dem der Wald nur auswendig lernt, erscheint trotzdem wichtig 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Merkmale mit vielen verschiedenen Werten (stetige Zahlen, Kennungen) werden bevorzugt, weil sie mehr Möglichkeiten zum Teilen bieten 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Bei stark zusammenhängenden Merkmalen kann jedes einzelne unbedeutend wirken, obwohl die gemeinsame Information wichtig ist 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->One-Hot-Spalten einer Kategorie werden einzeln bewertet

> [!warning]
> scikit-learn warnt in der eigenen Dokumentation: Wichtigkeiten aus der Unreinheit können bei Merkmalen mit vielen Ausprägungen irreführen.

## `permutation_importance` als robustere Alternative

```python
from sklearn.inspection import permutation_importance

result = permutation_importance(rf, X_test, y_test,
                                n_repeats=20, random_state=1)

perm = pd.DataFrame({
    "mittel": result.importances_mean,
    "std": result.importances_std,
}, index=X_test.columns).sort_values("mittel", ascending=False)
print(perm.round(3))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Idee: die Werte einer Spalte zufällig durchmischen und messen, wie stark die Kennzahl auf den Testdaten fällt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Arbeitet mit der ganzen Pipeline und den Originalspalten: `Sex` ist ein Merkmal, nicht zwei 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Funktioniert für jedes Modell, nicht nur für Bäume 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`n_repeats=20` wiederholt das Mischen und liefert eine Streuung dazu

## Grenzen der Interpretation

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zusammenhang ist keine Ursache.** Das Modell nutzt, was mit der Zielgröße zusammen auftritt. Ob eine Änderung des Merkmals die Zielgröße ändert, beantwortet es nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zusammenhängende Merkmale wirken einzeln unwichtig.** Zwei fast gleiche Spalten können beide unbedeutend erscheinen, obwohl die Information dahinter entscheidend ist 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Die Interpretation gilt für das Modell, nicht für die Welt.** Ein anderes Modell mit gleicher Güte kann andere Merkmale bevorzugen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Ein schlechtes Modell hat nichts zu erklären.** Erst die Güte auf Testdaten prüfen, dann interpretieren 

<div class="fragment" data-fragment-index="5">

> [!important]
> Formulieren Sie „das Modell stützt sich vor allem auf X", nicht „X verursacht Y".

</div>
</div></script></section><section data-separator="

## Ausblick: SHAP und LIME

| | SHAP | LIME |
|---|---|---|
| **Frage** | Welchen Beitrag hat jedes Merkmal zu dieser einen Vorhersage? | Welches einfache Modell beschreibt das Verhalten in der Nähe dieser einen Zeile? |
| **Idee** | verteilt die Abweichung vom Durchschnitt nach einem Verfahren aus der Spieltheorie (Shapley-Werte) auf die Merkmale | verändert die Zeile leicht, beobachtet die Vorhersagen und passt lokal ein lineares Modell an |
| **Ergebnis** | Beitrag je Merkmal und Zeile, über viele Zeilen auch eine globale Übersicht | Gewichte je Merkmal für eine einzelne Zeile |
| **Aufwand** | eigenes Paket, bei großen Daten rechenintensiv | eigenes Paket, Ergebnis schwankt mit der Zufallsstichprobe |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Beide erklären **einzelne** Vorhersagen, das können Permutation Importance und Partial Dependence nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Grenzen der vorigen Folie gelten unverändert
</div></script></section><section data-separator="

## Ergebnisse für die Fachabteilung darstellen

| Abschnitt im Ergebnisbericht | Inhalt |
|---|---|
| **Frage und Nutzen** | Welche Entscheidung soll das Modell unterstützen? |
| **Daten** | Quelle, Zeitraum, Zeilenzahl, weggelassene Spalten und warum |
| **Vorgehen** | Aufteilung, Pipeline, Art der Prüfung, in zwei bis drei Sätzen |
| **Güte** | eine zur Fragestellung passende Kennzahl, daneben die einfache Baseline |
| **Fehlerbild** | Konfusionsmatrix oder Residuenplot in Worten: Was wird übersehen, was fälschlich gemeldet? |
| **Wichtigste Merkmale** | Permutation Importance als Balkendiagramm, Richtung aus Partial Dependence oder Koeffizienten |
| **Grenzen** | für welche Fälle das Modell nicht gilt, bekannte Schwächen der Daten |
| **Wiederholbarkeit** | Datenstand, Versionen, `random_state`, Ablageort der Pipeline |

> [!tip]
> Übersetzen Sie Kennzahlen in Fälle: „Von 68 Ausfällen findet das Modell 65 und meldet 140 Mal falschen Alarm" statt „Recall 0,96".

## Checkliste vor dem ersten eigenen Modell

| Punkt | Frage, die Sie beantworten können müssen |
|---|---|
| **Fragestellung** | Welche Entscheidung soll das Ergebnis unterstützen? In einem Satz. |
| **Zielgröße** | Welche Spalte sagen Sie voraus, und liegt sie zum Zeitpunkt der Vorhersage schon vor? |
| **Datenlage** | Kennen Sie Verteilungen, Ausreißer und fehlende Werte? Sind IDs und Leckquellen aussortiert? |
| **Baseline** | Wie gut ist die einfachste Lösung (häufigste Klasse, Mittelwert, bestehende Regel)? |
| **Kennzahl** | Welche Fehler sind fachlich teuer, und welche Kennzahl bildet das ab? |
| **Testdaten** | Liegt ein Teil der Daten unberührt zurück, bis das Modell fertig ist? |

> [!tip]
> Können Sie einen Punkt nicht beantworten, klären Sie ihn zuerst. Modellcode schreiben Sie danach.

## Wann sich ML lohnt und wann nicht

<div class="two-col">
<div style="flex: 50">

**ML lohnt sich, wenn**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->ausreichend historische Daten vorliegen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->eine wiederkehrende Vorhersage oder Einordnung einen messbaren Nutzen hat, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->sich die Zusammenhänge nicht mehr mit einfachen Regeln beschreiben lassen, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie Fehlentscheidungen bewerten können (was kostet ein Fehlalarm, was ein übersehener Fall?). 

</div>
<div style="flex: 50">

<div class="fragment" data-fragment-index="5">

**ML lohnt sich eher nicht, wenn**

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->es kaum Daten, aber viele Ausnahmen und Sonderfälle gibt, 
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->die eigentliche Entscheidung fachlich noch nicht klar formuliert ist, 
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->eine bekannte Regel das Problem schon zuverlässig löst, 
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->sich weder Nutzen noch Fehlerkosten bewerten lassen.

## Voraussetzungen für ein brauchbares Modell

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein gutes Modell ist Teil eines größeren Ablaufs: Daten beschaffen, prüfen, aufbereiten, bewerten, betreiben. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Datenzugang, Datenqualität und eine saubere Zielgröße sind genauso wichtig wie der Algorithmus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Viele Vorhaben scheitern nicht am Modell, sondern an unreifen Daten oder einer unklaren Fragestellung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Ein Modell wird höchstens so gut wie seine Zielgröße: uneinheitlich oder verspätet erfasste Werte begrenzen jedes Ergebnis. 

<div class="fragment" data-fragment-index="5">

> [!important]
> Bevor Sie das Modell wechseln, prüfen Sie die Daten: `df.info()`, `df.describe()`, `df.isna().sum()`, `df.duplicated().sum()`.

## Typische Fehler beim Einstieg

| Fehler | Woran Sie ihn erkennen | Gegenmittel |
|---|---|---|
| **Datenleck** | Testergebnis unrealistisch gut | Erst `train_test_split`, dann alles Weitere in einer `Pipeline` |
| **Nur Accuracy** | 95 % Accuracy, aber die seltene Klasse wird nie erkannt | Konfusionsmatrix, Precision, Recall, F1 |
| **Kein Baseline-Vergleich** | Niemand weiß, ob 0,80 gut ist | `DummyClassifier` oder `DummyRegressor` zuerst |
| **Zellen in falscher Reihenfolge** | Notebook läuft nach Neustart nicht mehr durch | „Restart Kernel and Run All“ vor dem Weitergeben |
| **Keine festen Zufallswerte** | Jeder Lauf liefert andere Zahlen | `random_state=1` bei Split, Modell und CV |
| **Datentypen ungeprüft** | Datum oder Zahl steht als Text (`object` oder `str`) in `df.dtypes` | `pd.to_datetime`, `pd.to_numeric`, `astype` |
| **Zufälliger Split bei Zeitbezug** | Modell lernt aus der Zukunft | Nach Datum trennen: ältere Daten trainieren, neuere testen |
</div></script></section><section data-separator="

## Personenbezogene und besonders schützenswerte Daten

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sobald sich Daten auf eine identifizierbare Person beziehen, gilt die **DSGVO**, auch für Auswertungen und Modelle im Notebook. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gesundheitsdaten** sind besondere Kategorien personenbezogener Daten nach **Art. 9 DSGVO**: Die Verarbeitung ist grundsätzlich untersagt, Ausnahmen regelt Art. 9 Abs. 2. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Arbeiten Sie nur mit den Spalten, die Sie für die Frage brauchen (Datenminimierung), und nur für den festgelegten Zweck (Zweckbindung). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Ohne Namen ist nicht anonym:** Geschlecht, Geburtsdatum und Postleitzahl können einen Datensatz eindeutig machen. Auch pseudonymisierte Daten bleiben personenbezogen (Art. 4 Nr. 5 DSGVO). 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Zum Lernen und Ausprobieren: **synthetische oder anonymisierte Daten**, so wie die Versichertentabelle in diesem Kurs. Synthetische Daten sind aber nicht automatisch anonym.

## Vom Notebook zum wiederholbaren Skript

```python
import pandas as pd
from sklearn.ensemble import RandomForestClassifier
from sklearn.model_selection import train_test_split

def lade_daten(pfad):
    df = pd.read_csv(pfad)
    X = df[ ["Pclass", "SibSp", "Parch", "Fare"] ]
    X = X.assign(weiblich=df["Sex"] == "female")
    return X, df["Survived"]

def trainiere(X, y):
    X_tr, X_te, y_tr, y_te = train_test_split(
        X, y, test_size=0.2, random_state=1, stratify=y)
    modell = RandomForestClassifier(random_state=1).fit(X_tr, y_tr)
    return modell, modell.score(X_te, y_te)

if __name__ == "__main__":
    modell, acc = trainiere(*lade_daten("data/titanic.csv"))
    print(f"Accuracy Test: {acc:.3f}")   # -> Accuracy Test: 0.810
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jeder Schritt ist eine **Funktion** mit Eingabe und Rückgabe, nichts hängt von der Reihenfolge einzelner Zellen ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Start aus dem Terminal ab Repo-Wurzel: `python train.py`

## Umgebung und Stand festhalten

<div class="two-col">
<div style="flex: 50">

**Pakete festschreiben**

```text
conda env export --from-history > environment.yml
pip freeze > requirements.txt
```

- `environment.yml` beschreibt die conda-Umgebung, `requirements.txt` die pip-Pakete mit Version.
- Auf einem anderen Gerät: `conda env create -f environment.yml`

</div>
<div style="flex: 50">

**Stand mit Git sichern**

```text
git status
git add train.py environment.yml
git commit -m "Erstes Modell: Baseline + Random Forest"
```

- Ein Commit pro abgeschlossenem Schritt, mit einer Nachricht, die das Ergebnis nennt.
- Daten mit Personenbezug gehören nicht ins Repository (`.gitignore`).

</div>
</div>

> [!tip]
> Wiederholbar heißt: gleicher Code, gleiche Paketversionen, gleiche Daten, gleicher `random_state`.

## Ein erstes eigenes Projekt zuschneiden

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Klein anfangen:** eine Tabelle, eine Frage, ein Notebook. Kein Datenbankanschluss, kein Dashboard. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Vorhandene Tabelle nehmen:** eine Auswertung, die Sie heute schon in Excel pflegen und deren Spalten Sie fachlich kennen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Eine Frage formulieren:** „Welche Merkmale hängen mit X zusammen?“ oder „Lässt sich Y aus den übrigen Spalten vorhersagen?“ 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Erst beschreiben, dann modellieren:** `describe`, `groupby`, zwei bis drei Diagramme. Oft ist die Frage damit schon beantwortet. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Dann der Kursablauf:** Baseline, einfaches Modell, Kennzahl auf zurückgehaltenen Testdaten, Interpretation. 

<div class="fragment" data-fragment-index="6">

> [!tip]
> Legen Sie das erste eigene Notebook in den nächsten Tagen an. Training wirkt vor allem dann, wenn Anwendung und Follow-up folgen (Salas et al. 2012).

</div>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Ablauf bleibt gleich: Daten prüfen, Baseline, einfaches Modell, passende Kennzahl, zurückgehaltene Testdaten, Interpretation. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Datenqualität und eine klare Fragestellung entscheiden mehr als die Wahl des Algorithmus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Fünf Gewohnheiten schützen vor den häufigsten Fehlern: zuerst trennen, `Pipeline` nutzen, mehr als Accuracy ansehen, `random_state=1` setzen, Notebook komplett neu durchlaufen lassen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Gesundheitsdaten sind besondere Kategorien nach Art. 9 DSGVO: üben Sie mit synthetischen oder anonymisierten Daten und klären Sie echte Daten vorab.

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
