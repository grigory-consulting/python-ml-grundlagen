<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klassifikation: Problemstellung</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f4f7fb; }
  svg { display: block; width: 1200px; height: 296px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 296" role="img"
     aria-labelledby="klassifikation-problem-title klassifikation-problem-desc">
  <title id="klassifikation-problem-title">Klassifikation: von der Eingabe zur Klasse</title>
  <desc id="klassifikation-problem-desc">Ein Klassifikator lernt aus Trainingsbeispielen mit bekannter Klasse. Für eine neue Eingabe schätzt er eine Wahrscheinlichkeit je Klasse und gibt die Klasse mit der höchsten Wahrscheinlichkeit aus, hier gutartig mit 0.92.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5a6b82"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f4f7fb"/>

  <!-- Pfeile (vor den Boxen) -->
  <g stroke="#5a6b82" stroke-width="1.2" fill="none">
    <line x1="264" y1="208" x2="351" y2="208" marker-end="url(#arrow)"/>
    <line x1="608" y1="208" x2="695" y2="208" marker-end="url(#arrow)"/>
    <line x1="944" y1="208" x2="1039" y2="208" marker-end="url(#arrow)"/>
    <line x1="480" y1="88" x2="480" y2="167" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  </g>
  <text x="496" y="133" font-family="'Geist Mono', monospace" font-size="14" fill="#5a6b82"
        letter-spacing="0.06em">LERNT DARAUS</text>
  <rect x="956" y="176" width="72" height="20" rx="2" fill="#f4f7fb"/>
  <text x="992" y="191" font-family="'Geist Mono', monospace" font-size="14" fill="#5a6b82"
        text-anchor="middle" letter-spacing="0.06em">MAXIMUM</text>

  <!-- Trainingsbeispiele -->
  <rect x="352" y="24" width="256" height="64" rx="6" fill="#f4f7fb"/>
  <rect x="352" y="24" width="256" height="64" rx="6" fill="rgba(24,59,102,0.05)" stroke="#5a6b82" stroke-width="1"/>
  <text x="480" y="52" font-family="'Geist', sans-serif" font-size="20" font-weight="600" fill="#183b66"
        text-anchor="middle">Trainingsbeispiele</text>
  <text x="480" y="74" font-family="'Geist', sans-serif" font-size="14" fill="#5a6b82"
        text-anchor="middle">Merkmale x und bekannte Klasse y</text>

  <!-- Neue Eingabe -->
  <rect x="24" y="168" width="240" height="80" rx="6" fill="#ffffff" stroke="#183b66" stroke-width="1"/>
  <text x="144" y="204" font-family="'Geist', sans-serif" font-size="20" font-weight="600" fill="#183b66"
        text-anchor="middle">Neue Eingabe x</text>
  <text x="144" y="228" font-family="'Geist', sans-serif" font-size="14" fill="#5a6b82"
        text-anchor="middle">Merkmale, Klasse unbekannt</text>

  <!-- Klassifikator -->
  <rect x="352" y="168" width="256" height="80" rx="6" fill="#ffffff" stroke="#183b66" stroke-width="1"/>
  <text x="480" y="204" font-family="'Geist', sans-serif" font-size="20" font-weight="600" fill="#183b66"
        text-anchor="middle">Klassifikator</text>
  <text x="480" y="228" font-family="'Geist', sans-serif" font-size="14" fill="#5a6b82"
        text-anchor="middle">ordnet einer von k Klassen zu</text>

  <!-- Wahrscheinlichkeit je Klasse -->
  <rect x="696" y="144" width="248" height="128" rx="6" fill="#ffffff" stroke="#183b66" stroke-width="1"/>
  <text x="712" y="172" font-family="'Geist', sans-serif" font-size="16" font-weight="600" fill="#183b66">Wahrscheinlichkeit je Klasse</text>
  <text x="712" y="212" font-family="'Geist', sans-serif" font-size="16" fill="#183b66">gutartig</text>
  <rect x="792" y="198" width="92" height="16" rx="2" fill="#2459a6"/>
  <text x="928" y="212" font-family="'Geist Mono', monospace" font-size="14" fill="#183b66" text-anchor="end">0.92</text>
  <text x="712" y="248" font-family="'Geist', sans-serif" font-size="16" fill="#183b66">bösartig</text>
  <rect x="792" y="234" width="8" height="16" rx="2" fill="#8593a8"/>
  <text x="928" y="248" font-family="'Geist Mono', monospace" font-size="14" fill="#183b66" text-anchor="end">0.08</text>

  <!-- Ausgabe -->
  <rect x="1040" y="168" width="136" height="80" rx="6" fill="#f4f7fb"/>
  <rect x="1040" y="168" width="136" height="80" rx="6" fill="rgba(36,89,166,0.08)" stroke="#2459a6" stroke-width="1"/>
  <text x="1108" y="204" font-family="'Geist', sans-serif" font-size="20" font-weight="600" fill="#183b66"
        text-anchor="middle">gutartig</text>
  <text x="1108" y="228" font-family="'Geist', sans-serif" font-size="14" fill="#5a6b82"
        text-anchor="middle">Vorhersage</text>
</svg>
</body>
</html>
